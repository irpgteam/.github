name: Reusable CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      run-test:
        type: boolean
        default: false
    secrets:
      SUBMODULE_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: test -d prisma && npx prisma generate || true

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Test
        if: inputs.run-test
        run: npm test --if-present
